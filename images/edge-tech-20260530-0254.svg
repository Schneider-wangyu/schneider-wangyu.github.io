<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#2c3e50"/>
  <g transform="translate(600,400)">
    <!-- 工业控制相关图形 -->
    <circle r="200" fill="#3498db" opacity="0.8"/>
    <circle r="150" fill="#2980b9" opacity="0.6"/>
    <circle r="100" fill="#1abc9c" opacity="0.7"/>
    
    <!-- 电路板线条 -->
    <path d="M-200,0 L200,0 M0,-200 L0,200 M-141.4,-141.4 L141.4,141.4 M-141.4,141.4 L141.4,-141.4" 
          stroke="#ecf0f1" stroke-width="3" opacity="0.8"/>
    
    <!-- 控制节点 -->
    <circle cx="-100" cy="-100" r="15" fill="#e74c3c"/>
    <circle cx="100" cy="-100" r="15" fill="#f39c12"/>
    <circle cx="-100" cy="100" r="15" fill="#9b59b6"/>
    <circle cx="100" cy="100" r="15" fill="#1abc9c"/>
    
    <!-- 连接线 -->
    <path d="M-100,-100 L100,-100 L100,100 L-100,100 Z" 
          stroke="#ecf0f1" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- 文字 -->
    <text y="-250" text-anchor="middle" fill="#ecf0f1" font-family="Arial" font-size="48" font-weight="bold">
      EDGE CONTROL
    </text>
    <text y="250" text-anchor="middle" fill="#bdc3c7" font-family="Arial" font-size="32">
      IEC 61499 Distributed Control
    </text>
  </g>
</svg>